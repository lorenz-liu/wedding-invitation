name = "wedding-invitation"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Create with: wrangler d1 create wedding-guests
# Then paste database_id below.
[[d1_databases]]
binding = "DB"
database_name = "wedding-guests"
database_id = "c4fa89e0-39fc-4316-9e5a-6ee9fcfe764d"

# Create with: wrangler r2 bucket create wedding-assets
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "wedding-assets"

[vars]
CORS_ORIGIN = "*"

# Optional Tencent SMS (wrangler secret put SMS_SECRET_ID, etc.)
# SMS_SECRET_ID
# SMS_SECRET_KEY
# SMS_SDK_APP_ID
# SMS_SIGN_NAME
# SMS_TEMPLATE_ID
# SMS_REGION = "ap-guangzhou"
