AWSTemplateFormatVersion: '2010-09-09'
Description: Wedding Invitation Backend - DynamoDB and SNS

Resources:
  GuestResponsesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: wedding-guests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PhoneIndex
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: WeddingInvitation

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wedding-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt GuestResponsesTable.Arn
                  - !Sub '${GuestResponsesTable.Arn}/index/*'
        - PolicyName: SNSSMSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                  - sns:SetSMSAttributes
                Resource: '*'

  SubmitResponseFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: handle-guest-form-submission
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            body: JSON.stringify({ error: 'Lambda code not deployed yet. Run ./deploy.sh' })
          });
      Environment:
        Variables:
          TABLE_NAME: wedding-guests
      Timeout: 30
      MemorySize: 256
      Tags:
        - Key: Project
          Value: WeddingInvitation

  SubmitResponseFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !Ref SubmitResponseFunction
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 86400

  SubmitResponseFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubmitResponseFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  ApiEndpoint:
    Description: Lambda Function URL for guest form submission
    Value: !GetAtt SubmitResponseFunctionUrl.FunctionUrl
    Export:
      Name: WeddingApiEndpoint

  DynamoDBTable:
    Description: DynamoDB table name
    Value: !Ref GuestResponsesTable
    Export:
      Name: WeddingTableName

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref SubmitResponseFunction
    Export:
      Name: WeddingLambdaFunctionName
