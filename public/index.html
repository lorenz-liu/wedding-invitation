  <style>
    /* Loading styles */
    .taro-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #faf8f5 0%, #f5f0e8 100%);
      z-index: 9999;
    }
    .taro-loading-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      color: #6b6b6b;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>

    <div class="taro-loading">
